[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsunami-modeling"
version = "1.0.0"
description = "Verified linear and nonlinear fully-wet shallow-water modeling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "Pillow>=9,<13"]

[tool.setuptools.packages.find]
where = ["src"]
